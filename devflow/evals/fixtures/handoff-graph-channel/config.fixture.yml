language:
  user: es
  team: en
tracker:
  type: azure-devops
  organization: https://dev.azure.com/contoso
  project: Webshop
  ref_format: "AB#{id}"
  github_link_works: false
  states:
    new: New
    triaged: Triaged
    in_progress: In Progress
    testing: Testing
    later: [Done, Closed, Removed]
  fields:
    remaining_hours: Microsoft.VSTS.Scheduling.RemainingWork
    actual_hours: Custom.ActualTime
  transition_requirements:
    testing: [remaining_hours=0, actual_hours]
notifier:
  type: teams
  mode: graph
  graph:
    target: dm
    team_id: "team-0000-webshop"
    channel_id: "19:webshop-testing@thread.tacv2"
    channel_name: "Webshop / Testing"
commit:
  format: "{PREFIX}: {ref} {summary}"
  prefixes: [FIX, ENH, OPT, INT, TEST, DOC, CHORE, BREAK, WIP]
branch:
  pattern: "{kind}/{id}-{description-kebab}"
  kinds: { bug: bugfix, default: feature }
defaults:
  reviewer: alice-gh
  tester: alice@contoso.com
people:
  alice: { github: alice-gh, tracker: alice@contoso.com, display: Alice Smith, teams_id: "6f1c2a9e-0000-4000-8000-a11ce0000001" }
  bob: { github: bob-gh, tracker: bob@contoso.com, display: Bob Jones }
repos:
  contoso/webshop:
    notifier_target: channel
    build: "npm ci && npm run build"
    test: "npm test"
ci:
  known_failures: []
secrets:
  teams_webhook: "https://contoso.webhook.office.com/SECRET-DO-NOT-PRINT"

work:
  timezone: Europe/London
  work_days: [Mon, Tue, Wed, Thu, Fri]
  work_hours: "09:00-17:30"
handoff:
  require_approved_pr: false
